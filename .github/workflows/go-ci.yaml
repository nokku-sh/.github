name: Go CI

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check, defaults to the triggering commit
        type: string
        default: ""
      vulncheck:
        description: Run govulncheck, only turn this off with a linked reason
        type: boolean
        default: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  go:
    name: Go
    # RUNNER is a repo or org variable, fork PRs always stay on hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      # A repo's prepare action reads this to start what its tests need.
      RUN_TESTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      # Nothing is published from this job, a poisoned cache can only fail it.
      - uses: nokku-sh/.github/actions/go-cache@main

      # Resolves to the calling repo, the checkout above put it in the workspace.
      - name: Prepare
        if: hashFiles('.github/actions/prepare/action.yml') != ''
        uses: ./.github/actions/prepare # zizmor: ignore[self-repository]

      - name: Modules
        run: |
          go mod tidy -diff
          go mod verify

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          skip-cache: ${{ runner.environment != 'github-hosted' }}

      - name: Test
        run: go test -race -shuffle=on ./...

      # Not govulncheck-action, its own setup-go uploads the self-hosted runner's whole Go cache.
      - name: Vulncheck
        if: inputs.vulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: GoReleaser config
        if: hashFiles('.goreleaser.yaml') != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: check

  # Inlined instead of calling actionlint.yaml, release would hit the nesting limit.
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
